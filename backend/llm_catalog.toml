# Catalog of the language models clients can use.
#
# Each request uses one model, chosen by the client (or default_model): there is no fallback.
# A model is enabled only when its provider has an API key in the .env file.
#
# One model per provider: the one best suited to this problem (reading document pages with
# their images and copying items literally), in a similar price range so clients can compare
# providers fairly.
#
# Add a model of an existing provider: copy a [[models]] block and change its fields.
# Add a provider: add a [providers.<id>] block (the id is the prefix of the LiteLLM model
# name, e.g. "gemini" in "gemini/gemini-3.8-flash") and put its API key in the .env file:
# LLM_API_KEYS={"<id>": "<key>"}  (Gemini can also use GEMINI_API_KEY).
#
# Before adding a model, check on the provider's models page that it is not deprecated and
# use its exact API id. Avoid "-latest" aliases: they silently move to other (or deprecated)
# versions, which breaks comparisons between runs.
#
# Model fields:
#   id                 Short, stable name clients send to choose the model.
#   model              LiteLLM model name: "provider/model".
#   label, description Shown to clients (in Spanish).
#   free               Uses a free plan (low limits; check the provider's data policy).
#   vision             Can read page images. Required for scanned documents.
#   max_output_tokens, max_input_tokens (optional, looked up in LiteLLM when missing),
#   temperature (optional, provider default when missing), reasoning_effort (optional:
#   minimal | low | medium | high), json_mode (default true).

default_model = "gemini-flash"

[providers.gemini]
label = "Google Gemini"
description = "Modelos de Google. Proveedor principal del servicio."

[providers.openai]
label = "OpenAI (ChatGPT)"
description = "Modelos de OpenAI, los mismos que usa ChatGPT."

[providers.deepseek]
label = "DeepSeek"
description = "Modelos de DeepSeek, de bajo costo."

[[models]]
id = "gemini-flash"
model = "gemini/gemini-3.8-flash"
label = "Gemini 3.8 Flash"
description = "Rápido y preciso leyendo documentos, incluidos los escaneados. Recomendado para la mayoría de los cuestionarios."
vision = true
max_output_tokens = 32000

[[models]]
id = "gpt-terra"
model = "openai/gpt-6.1-terra"
label = "GPT-6.1 Terra"
description = "Modelo de OpenAI pensado para razonamiento visual, rápido y eficiente. Lee documentos escaneados."
vision = true
max_output_tokens = 32000

[[models]]
id = "deepseek-flash"
model = "deepseek/deepseek-flash"
label = "DeepSeek V4.1 Flash"
description = "El más económico de los tres. Lee documentos escaneados."
vision = true
max_output_tokens = 32000
