[project]
name = "giunti-eval"
version = "0.1.0"
description = "Synthetic test generation and extraction quality evaluation."
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20261017",
]
compare = [
    "docling>=2.0",
    "markitdown[all]>=0.1",
    "pdfplumber>=0.11",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE",
    "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "RUF", "ANN", "ASYNC", "S", "LOG",
    "G", "PERF", "FURB", "BLE", "EM", "FBT",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["generator"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Run outputs (git-ignored, like for ruff): not part of the evaluation code.
exclude = ["^results/"]
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]
